name: iFill
main: io.github.apdevteam.ifill.FillPlugin
version: ${projectVersion}
api-version: 1.20
author: Pocketkid2, TylerS1066
description: Fill container blocks rapidly!
commands:
    fill:
        description: Set, give, or remove a fill wand
        usage: /fill <id> <qty> <dv>
        permission: ifill.command
permissions:
    ifill.command:
        description: Allows you to use the command
        default: op
    ifill.use:
        description: Allows you to use the item
        default: op